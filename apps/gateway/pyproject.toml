[project]
name = "govcontrol-gateway"
version = "0.1.0"
description = "GovControl API gateway, BFF and institutional authentication boundary"
requires-python = ">=3.12,<3.13"
dependencies = [
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "redis>=5.2,<8.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.31,<3.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["^tests/"]
plugins = ["pydantic.mypy"]
