name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest
  contracts-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/contracts-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy contracts_app
      - run: uv run pytest
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy gateway_app
      - run: uv run pytest
  documents-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: govcontrol_documents_ci
          POSTGRES_USER: govcontrol
          POSTGRES_PASSWORD: govcontrol-documents-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govcontrol -d govcontrol_documents_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOCUMENTS_DATABASE_URL: postgresql+asyncpg://govcontrol:govcontrol-documents-ci@127.0.0.1:5432/govcontrol_documents_ci
    defaults:
      run:
        working-directory: apps/documents-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy documents_app
      - run: uv run pytest
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: docker build .
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- navigation.spec.ts
