services:
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://govcontrol:${POSTGRES_PASSWORD}@postgres:5432/govcontrol
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      - api
  postgres:
    image: postgres:16-alpine
    container_name: govcontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-govcontrol}
      POSTGRES_USER: ${POSTGRES_USER:-govcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
