name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: govcontrol_platform_ci
          POSTGRES_USER: govcontrol
          POSTGRES_PASSWORD: govcontrol-platform-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govcontrol -d govcontrol_platform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://govcontrol:govcontrol-platform-ci@127.0.0.1:5432/govcontrol_platform_ci
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: docker build .
  contracts-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: govcontrol_contracts_ci
          POSTGRES_USER: govcontrol
          POSTGRES_PASSWORD: govcontrol-contracts-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govcontrol -d govcontrol_contracts_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTRACTS_DATABASE_URL: postgresql+asyncpg://govcontrol:govcontrol-contracts-ci@127.0.0.1:5432/govcontrol_contracts_ci
    defaults:
      run:
        working-directory: apps/contracts-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy contracts_app
      - run: uv run pytest
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: docker build .
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy gateway_app
      - run: uv run pytest
      - run: docker build .
  documents-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: govcontrol_documents_ci
          POSTGRES_USER: govcontrol
          POSTGRES_PASSWORD: govcontrol-documents-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govcontrol -d govcontrol_documents_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOCUMENTS_DATABASE_URL: postgresql+asyncpg://govcontrol:govcontrol-documents-ci@127.0.0.1:5432/govcontrol_documents_ci
    defaults:
      run:
        working-directory: apps/documents-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy documents_app
      - run: uv run pytest
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: docker build .
  notifications-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: govcontrol_notifications_ci
          POSTGRES_USER: govcontrol
          POSTGRES_PASSWORD: govcontrol-notifications-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govcontrol -d govcontrol_notifications_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOTIFICATIONS_DATABASE_URL: postgresql+asyncpg://govcontrol:govcontrol-notifications-ci@127.0.0.1:5432/govcontrol_notifications_ci
      GOVCONTROL_INTEGRATION: "1"
    defaults:
      run:
        working-directory: apps/notifications-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy notifications_app
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - run: uv run alembic check
      - run: docker build .
  insights-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: govcontrol_insights_ci
          POSTGRES_USER: govcontrol
          POSTGRES_PASSWORD: govcontrol-insights-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govcontrol -d govcontrol_insights_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      INSIGHTS_DATABASE_URL: postgresql+asyncpg://govcontrol:govcontrol-insights-ci@127.0.0.1:5432/govcontrol_insights_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      GOVCONTROL_INTEGRATION: "1"
    defaults:
      run:
        working-directory: apps/insights-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy insights_app
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: docker build .
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- navigation.spec.ts notifications.spec.ts insights.spec.ts
